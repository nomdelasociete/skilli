# skil.li's release, built on GitHub's Macs instead of the developer's Mac or the Mac mini:
# the same scripts (script/release/publish.sh), Xcode 27, every credential
# from the `release` environment, which waits for the maintainer's approval and takes
# only `main`. Started from skil.li (the "Release skil.li" skillie,
# script/release/release.skilli), Actions → Release → Run workflow, or
# `gh workflow run release.yml -f bump=patch`. Its version is the newest
# release tag raised by `bump` (script/release/version.sh): no pull request
# raises it first. `critical` makes it a critical update
# (script/release/appcast.sh). The secrets are set once with
# script/release/ci-secrets.sh.
#
# A pull request that changes the release itself is built here too, unsigned
# and with no secret, so a broken toolchain is seen before a release needs it.
name: Release
# skil.li's menu bar item and GitHub's list show which release this is.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Release {0}{1}', inputs.bump, inputs.critical && ', critical' || '')
      || 'Release check' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version raised from the last release
        type: choice
        options: [patch, minor]
        default: patch
      critical:
        description: Critical update (shown at once, cannot be skipped)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - script/release/**
      - script/stamp_build.sh
      - project.yml
      - Config/**

permissions:
  contents: read

# One release at a time; a second one waits rather than racing the feed.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The build number is the commit count.
          fetch-depth: 0
      - name: Xcode 27.1, XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          brew install xcodegen
      - name: Unit tests
        run: swift test
      - name: Release build, unsigned, with the next patch's version
        # The runner's bash is 3.2: a failed `[[ ]]` does not stop a step
        # there, and `| tail` hid xcodebuild's failure (a build that did not
        # compile passed, 2026-10-31). Each check fails the step itself.
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          # The version a patch release would take, as release does.
          version="$(script/release/version.sh patch)"
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          echo "Last release ${latest:-none}; a patch would be $version"
          xcodegen generate
          xcodebuild -project Skilli.xcodeproj -scheme Skilli -configuration Release \
            -destination "generic/platform=macOS" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO SKILLI_KLIPY_KEY=check-build MARKETING_VERSION="$version" \
            build | tail -n 5
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/Skilli.app"
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          echo "Built $built ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist"))"
          # The version passed is the one the app says.
          [[ "$built" == "$version" ]] || { echo "The app says $built, not $version." >&2; exit 1; }
          # The key reaches the app as a release's would.
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SkilliKlipyKey' "$app/Contents/Info.plist")" == check-build ]] \
            || { echo "SkilliKlipyKey did not reach the app." >&2; exit 1; }
          # The self-tests and their test data never ship (grep reads it
          # whole: `-q` would cut strings off, a failure under pipefail).
          if strings "$app/Contents/MacOS/Skilli" | grep 'SELFTEST' >/dev/null; then
            echo "This build contains the self-tests." >&2; exit 1
          fi

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      # The GitHub release of this repository.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Xcode 27.1, XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          brew install xcodegen
      - name: Credentials, in this run's temporary folder only
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # The Developer ID certificate in a keychain of its own, first in the
          # search list so codesign finds it; deleted at the end of the run.
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "No Developer ID Application identity in DEVELOPER_ID_P12." >&2; exit 1; }
          # Notarization's API key and Sparkle's private key as files.
          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          chmod 600 "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, notarize, publish
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLI_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SKILLI_KLIPY_KEY: ${{ secrets.SKILLI_KLIPY_KEY }}
          SKILLI_SPARKLE_PUBLIC_ED_KEY: ${{ vars.SKILLI_SPARKLE_PUBLIC_ED_KEY }}
          SKILLI_NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          SKILLI_NOTARY_ISSUER: ${{ vars.NOTARY_ISSUER_ID }}
          SKILLI_CRITICAL_UPDATE: ${{ inputs.critical }}
          BUMP: ${{ inputs.bump }}
        run: |
          export SKILLI_NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8"
          export SKILLI_SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key"
          script/release/publish.sh "$BUMP"
      - name: Forget the credentials
        if: always()
        run: |
          [[ -n "${RELEASE_KEYCHAIN:-}" ]] && security delete-keychain "$RELEASE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/developer-id.p12"
