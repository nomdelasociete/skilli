# The repository is public: every pull request is checked for what must never
# be added (AGENTS.md → This repository is public). Generic patterns only:
# a list of private names would itself be private.
name: Hygiene

on:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: No keys, home paths or remote-access details in what this pull request adds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          added=$(git diff -U0 "$BASE" "$HEAD" -- . ':!website/legal.html' ':!.github/workflows/hygiene.yml' | grep -E '^\+' | grep -vE '^\+\+\+ ' || true)
          patterns=(
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}'
            '\bsk-[A-Za-z0-9]{40,}'
            '\b(ghp|gho|ghs|github_pat)_[A-Za-z0-9_]{30,}'
            '\bAKIA[0-9A-Z]{16}\b'
            '/Users/[A-Za-z0-9._-]+'
            'vnc://'
            '\.ts\.net\b'
          )
          found=0
          for p in "${patterns[@]}"; do
            hits=$(printf '%s\n' "$added" | grep -nE -e "$p" | grep -vE '/Users/(me|test|x|someone|m e)([/"'"'"'` ]|$)' || true)
            if [[ -n "$hits" ]]; then
              echo "::error::Added lines match '$p':"
              printf '%s\n' "$hits" | cut -c1-200 | head -10
              found=1
            fi
          done
          exit "$found"
