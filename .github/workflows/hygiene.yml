# The repository is public: every pull request is checked for what must never
# be added (AGENTS.md → This repository is public). Generic patterns only:
# a list of private names would itself be private.
#
# pull_request_target: the check runs from the base branch's copy of this
# file, so a pull request cannot change the check it is checked by. The pull
# request's commits are fetched as data and only diffed, never run.
name: Hygiene

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The pull request's commits, as data
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/head"
      - name: No keys, home paths or remote-access details in what this pull request adds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          added=$(git diff -U0 "$(git merge-base "$BASE" "$HEAD")" "$HEAD" | grep -E '^\+' | grep -vE '^\+\+\+ ' || true)
          found=0
          # Written so that this file does not match itself.
          patterns=(
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}'
            '\bsk-[A-Za-z0-9]{40,}'
            '\b(ghp|gho|ghs|github_pat)_[A-Za-z0-9_]{30,}'
            '\bAKIA[0-9A-Z]{16}\b'
            'vnc:[/][/]'
            '\.ts\.net\b'
          )
          for p in "${patterns[@]}"; do
            hits=$(printf '%s\n' "$added" | grep -nE -e "$p" || true)
            if [[ -n "$hits" ]]; then
              echo "::error::Added lines match '$p':"
              printf '%s\n' "$hits" | cut -c1-200 | head -10
              found=1
            fi
          done
          # Home paths: each path on its own, the test ones allowed (/Users/me…).
          homes=$(printf '%s\n' "$added" | grep -noE '/(Users|home)/[A-Za-z0-9._-]+' \
            | grep -vE ':/(Users|home)/(me|m|test|x|someone|runner)$' || true)
          if [[ -n "$homes" ]]; then
            echo "::error::Added lines name a real home path (test data uses /Users/me):"
            printf '%s\n' "$homes" | head -10
            found=1
          fi
          exit "$found"
