name: Skilli

options:
  bundleIdPrefix: com.nomdelasociete
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  # Updates of the Developer ID build (script/release): the feed and its
  # key are given by the release build only, so development builds never
  # update themselves.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2
  # The meeting recorder's voices told apart (docs/meeting-recorder.md,
  # "Who spoke"): Argmax's SpeakerKit (MIT), linked by skil.li Transcriber
  # only, never by the app.
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
  # Better transcription's engine (whisper.cpp 1.9.5's XCFramework, MIT):
  # linked by skil.li Transcriber, embedded in the app's Frameworks for it.
  WhisperCpp:
    path: Packages/WhisperCpp

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: JSFMAD28GS
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES

targets:
  SkilliCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SkilliCore
    settings:
      base:
        PRODUCT_NAME: SkilliCore
        PRODUCT_BUNDLE_IDENTIFIER: com.nomdelasociete.Skilli.core
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES

  Skilli:
    type: application
    platform: macOS
    sources:
      - path: Sources/Skilli
        excludes:
          - Resources/Apps
      # The linked apps skil.li ships as app files (docs/apps.md), read
      # from Contents/Resources/Apps as the user's are from their folder.
      - path: Sources/Skilli/Resources/Apps
        type: folder
        buildPhase: resources
    dependencies:
      - target: SkilliCore
        embed: true
      - package: Sparkle
        product: Sparkle
      # The recorder's helper, beside the app's executable (Contents/MacOS).
      - target: Transcriber
        embed: true
        copy:
          destination: executables
      # whisper.framework, as the helper's build puts it in the products:
      # embedded for the helper, never linked by the app.
      - framework: whisper.framework
        implicit: true
        link: false
        embed: true
    settings:
      base:
        PRODUCT_NAME: Skilli
        # Set by script/release/build.sh; empty in development builds.
        SKILLI_UPDATE_FEED_URL: ""
        SKILLI_SPARKLE_PUBLIC_ED_KEY: ""
        # skil.li's Klipy key (Search GIFs); never in the repository.
        SKILLI_KLIPY_KEY: ""
        PRODUCT_MODULE_NAME: Skilli
        PRODUCT_BUNDLE_IDENTIFIER: com.nomdelasociete.Skilli
        GENERATE_INFOPLIST_FILE: YES
        # skilli:// links (command import); merged with the generated keys.
        INFOPLIST_FILE: Config/Info.plist
        # Microphone (Ask by Voice) and Reminders under the Hardened Runtime.
        CODE_SIGN_ENTITLEMENTS: Config/Skilli.entitlements
        # Every name a person reads is skil.li: en.lproj/InfoPlist.strings gives
        # it to menus, Finder, the Dock and permission lists. These two stay
        # the file's name (Skilli.app), which macOS requires before it shows
        # the localized one (LSHasLocalizedDisplayName in Config/Info.plist).
        INFOPLIST_KEY_CFBundleDisplayName: Skilli
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSMinimumSystemVersion: "26.0"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© Nom de la société"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "1"
        # Event taps, Accessibility and synthetic keys are not allowed in the
        # App Sandbox. Distribution is Developer ID + notarization (like dsmn).
        ENABLE_APP_SANDBOX: NO
      configs:
        # The self-tests (SelfTest.swift) only in Debug; a Release build that
        # runs them adds the flag (script/build_and_run.sh), a release never.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SKILLI_SELFTEST"
    # The build number (commit count), the commit and the build's time, for
    # Settings → About. SpeakerKit's models (11 MB, fetched once, checked)
    # into Contents/Resources/SpeakerKit for skil.li Transcriber.
    postBuildScripts:
      - name: SpeakerKit's models
        script: "\"$SRCROOT/script/speakerkit_models.sh\""
        basedOnDependencyAnalysis: false
      - name: Stamp the build
        script: "\"$SRCROOT/script/stamp_build.sh\""
        # After Info.plist is written, every build: its input orders it.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false

  # The meeting recorder's helper (docs/meeting-recorder-views.md, phase
  # 4): started for a transcript, gone after it, so the models' memory
  # never counts against skil.li's. Linked to SkilliCore in the app's
  # Frameworks.
  Transcriber:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Transcriber
    dependencies:
      - target: SkilliCore
        embed: false
      - package: ArgmaxOSS
        product: SpeakerKit
      - package: WhisperCpp
        product: WhisperCpp
        embed: false
    settings:
      base:
        PRODUCT_NAME: "skil.li Transcriber"
        PRODUCT_MODULE_NAME: Transcriber
        PRODUCT_BUNDLE_IDENTIFIER: com.nomdelasociete.Skilli.transcriber
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  Skilli:
    build:
      targets:
        Skilli: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
